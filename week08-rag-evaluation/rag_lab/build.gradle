plugins {
    id 'application'
}
repositories { mavenCentral() }
dependencies {
    implementation 'org.apache.lucene:lucene-core:9.12.3'
    implementation 'org.apache.lucene:lucene-analysis-common:9.12.3'
    implementation 'org.apache.lucene:lucene-analysis-nori:9.12.3'
    implementation 'com.openai:openai-java:4.60.0'
    implementation 'dev.langchain4j:langchain4j:1.20.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'lab.week08.Quickstart' }

tasks.register('rag', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = providers.gradleProperty('ragMain').orElse('lab.week08.RagApplication')
}

tasks.register('contextExample', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'lab.week08.ContextChoices'
}
tasks.register('evaluate', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'lab.week08.Evaluation'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs += '-parameters'
}
tasks.withType(JavaExec).configureEach {
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging { events 'passed', 'skipped', 'failed' }
}
if (project.hasProperty('courseBuildDir')) {
    layout.buildDirectory = file(project.property('courseBuildDir'))
}
