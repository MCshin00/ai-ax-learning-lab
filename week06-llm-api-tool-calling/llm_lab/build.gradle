plugins {
    id 'application'
}
repositories { mavenCentral() }
dependencies {
    implementation 'com.openai:openai-java:4.60.0'
    implementation 'com.google.genai:google-genai:1.70.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'lab.week06.Quickstart' }
tasks.register('assistant', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = providers.gradleProperty('assistantMain').orElse('lab.week06.AssistantExercise')
}
tasks.register('gemini', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'lab.week06.GeminiQuickstart'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
    options.compilerArgs += '-parameters'
}
tasks.withType(JavaExec).configureEach {
    standardInput = System.in
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    testLogging { events 'passed', 'skipped', 'failed' }
}
if (project.hasProperty('courseBuildDir')) {
    layout.buildDirectory = file(project.property('courseBuildDir'))
}
