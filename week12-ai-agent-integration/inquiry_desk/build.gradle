plugins { id 'application' }
application { mainClass = 'lab.inquiry.status.OperationsMain' }
repositories { mavenCentral() }
dependencies {
    implementation 'com.openai:openai-java:4.60.0'
    implementation 'io.modelcontextprotocol.sdk:mcp:1.1.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release.set(17); options.compilerArgs.add('-parameters') }
tasks.withType(JavaExec).configureEach { defaultCharacterEncoding='UTF-8'; jvmArgs '-Dfile.encoding=UTF-8' }
// Hook은 앱 배포물과 업무 검사에서 분리한다.
sourceSets {
    harness { java.srcDir 'src/harness/java' }
    harnessTest {
        java.srcDir 'src/harnessTest/java'
        compileClasspath += sourceSets.harness.output
        runtimeClasspath += sourceSets.harness.output
    }
}
dependencies {
    // 종료·시작 Hook은 파일 하나로 실행하므로 JDK만 쓴다. 작업자 실행 관리(lab.harness.run)는 기록 파일에 JSON을 쓴다.
    harnessImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    harnessTestImplementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    harnessTestImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    harnessTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(Test).configureEach { useJUnitPlatform(); systemProperty 'file.encoding','UTF-8' }
tasks.named('test', Test) {
    // Gradle 검사 JVM의 클래스패스 대신 실제 서버 실행에 필요한 앱 클래스패스를 전달한다.
    systemProperty 'inquiry.server.classpath', sourceSets.main.runtimeClasspath.asPath
    systemProperty 'inquiry.test.classpath', sourceSets.test.runtimeClasspath.asPath
}
tasks.register('harnessTest', Test) {
    description = '종료 판정과 시작 문맥 Hook을 검사한다.'
    group = 'verification'
    testClassesDirs = sourceSets.harnessTest.output.classesDirs
    classpath = sourceSets.harnessTest.runtimeClasspath
}
tasks.named('check') { dependsOn tasks.named('harnessTest') }
// 작업자 실행 관리를 Gradle 밖에서 실행할 수 있게 클래스와 라이브러리를 한 폴더에 모은다.
tasks.register('installWorkerRun', Sync) {
    description = '작업자 실행 관리의 실행 파일을 build/worker-run에 모은다.'
    group = 'harness'
    from(sourceSets.harness.runtimeClasspath.filter { it.name.endsWith('.jar') }) { into 'lib' }
    from(sourceSets.harness.output) { into 'classes' }
    into layout.buildDirectory.dir('worker-run')
}
if (project.hasProperty('courseBuildDir')) { layout.buildDirectory=file(project.property('courseBuildDir')) }
