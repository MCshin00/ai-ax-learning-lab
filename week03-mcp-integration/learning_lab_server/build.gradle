plugins { id 'application' }

group = 'lab.week03'
version = '1.0-SNAPSHOT'
repositories { mavenCentral() }
dependencies {
    implementation 'io.modelcontextprotocol.sdk:mcp:1.1.4'
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'net.java.dev.jna:jna:5.17.0'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.17'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'lab.week03.CatalogServer' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}
tasks.named('run') { standardInput = System.in }
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'server.classpath', sourceSets.main.runtimeClasspath.asPath
    systemProperty 'test.classpath', sourceSets.test.runtimeClasspath.asPath
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}

tasks.register('inspector', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'lab.week03.InspectorServer'
    standardInput = System.in
}
