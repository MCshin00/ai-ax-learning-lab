[project]
name = "ai-ax-learning-lab-mcp"
version = "0.2.0"
description = "Read-only MCP server for the AI/AX learning lab"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]==2.0.0",
  "pydantic==2.13.4",
]

[project.scripts]
ai-ax-learning-lab-mcp = "learning_lab_mcp.server:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_lab_mcp"]
