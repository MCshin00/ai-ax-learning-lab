plugins { id 'application' }
repositories { mavenCentral() }
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'lab.export.ExportExample' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.release.set(17) }
tasks.withType(Test).configureEach {
    useJUnitPlatform(); systemProperty 'file.encoding','UTF-8'
}
tasks.register('acceptance', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'lab/export/**'
}
if (project.hasProperty('courseBuildDir')) { layout.buildDirectory=file(project.property('courseBuildDir')) }
